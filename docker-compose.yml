name: consig-risk

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: consig-risk:local
  env_file:
    - path: .env
      required: false
  volumes:
    - ./data:/app/data
    - ./artifacts:/app/artifacts

services:
  # Baixa e prepara os dados públicos (idempotente). Na primeira vez leva ~40 min.
  data-prep:
    <<: *app
    command: ["python", "-m", "consig_risk.data"]

  api:
    <<: *app
    depends_on:
      data-prep:
        condition: service_completed_successfully
    command: ["uvicorn", "consig_risk.api.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ui:
    <<: *app
    command:
      - streamlit
      - run
      - src/consig_risk/ui/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
