[project]
name = "consig-risk"
version = "0.1.0"
description = "Agent de risco de empregador para consignado privado, baseado em dados abertos de CNPJ."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "duckdb>=1.5.6",
    "fastapi>=0.115",
    "google-adk[db]>=2.12.0",
    "httpx>=0.27",
    "lifelines>=0.30.3",
    "lightgbm>=4.7.0",
    "litellm>=1.105.1",
    "pandas>=2.3.3",
    "pyarrow>=26.0.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "scikit-learn>=1.9.1",
    "streamlit>=1.40",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.0",
    "mypy>=1.11",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
notebooks = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consig_risk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "PTH", "RUF"]
# Travessão e sinal de multiplicação são tipografia intencional, não caracteres confundíveis.
allowed-confusables = ["–", "×"]

[tool.ruff.lint.per-file-ignores]
# Notebooks são análise, não código de produção: SQL em linhas longas, travessões nos rótulos
# dos gráficos ("1–3 anos") e zip de séries de mesmo tamanho.
"notebooks/*.ipynb" = ["E501", "RUF001", "B905"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
# Bibliotecas sem anotações de tipo publicadas.
module = ["sklearn.*", "lifelines.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# A avaliação com LLM real (tests/llm) só roda quando pedida: `uv run pytest -m llm`.
addopts = "-ra --strict-markers -m 'not llm' --cov=consig_risk --cov-report=term-missing"
markers = [
    "integration: testes que tocam disco, rede local ou artefatos treinados",
    "llm: testes que chamam um provedor de LLM real (exigem LLM_API_KEY)",
]

[tool.coverage.run]
source = ["consig_risk"]
# A UI Streamlit é validada manualmente/end-to-end; não entra na métrica de cobertura.
omit = ["src/consig_risk/ui/*"]
