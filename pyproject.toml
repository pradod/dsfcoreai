[project]
name = "consig-risk"
version = "0.1.0"
description = "Agent de risco de empregador para consignado privado, baseado em dados abertos de CNPJ."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "streamlit>=1.40",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consig_risk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "PTH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=consig_risk --cov-report=term-missing"
markers = [
    "integration: testes que tocam disco, rede local ou artefatos treinados",
    "llm: testes que chamam um provedor de LLM real (exigem LLM_API_KEY)",
]

[tool.coverage.run]
source = ["consig_risk"]
# A UI Streamlit é validada manualmente/end-to-end; não entra na métrica de cobertura.
omit = ["src/consig_risk/ui/*"]
